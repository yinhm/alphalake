name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF verification dependency
        run: python -m pip install pypdf==6.17.0
      - name: Verify Anker financial evidence offline
        run: python internal/ingest/testdata/anker-valuation-2026/verify.py
      - name: Verify Anker historical evidence offline
        run: python internal/ingest/testdata/anker-history-2026/verify.py
