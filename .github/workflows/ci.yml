name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve modules
        run: |
          go mod tidy
          echo '--- go.mod ---'
          cat go.mod
          echo '--- go.sum ---'
          cat go.sum
      - name: Test
        run: go test ./...
