name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF verification dependency
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-pdf.txt
      - name: Verify correction PDF evidence offline
        run: python internal/ingest/testdata/correction-600113/verify.py
      - name: Verify tax and debt PDF evidence offline
        run: python internal/ingest/testdata/tax-debt-2025/verify.py
      - name: Verify TTM PDF evidence offline
        run: python internal/ingest/testdata/ttm-2026/verify.py
      - name: Verify core financial PDF evidence offline
        run: python internal/ingest/testdata/core-financial-2025/verify.py
      - name: Verify Anker historical evidence offline
        run: python internal/ingest/testdata/anker-history-2026/verify.py
      - name: Verify standard valuation chains and both PDF references offline
        run: python internal/ingest/testdata/valuation-chain-2026/verify.py
      - name: Install valuation dependencies
        run: python -m pip install -e './valuation/backend[dev]'
      - name: Verify reference publication and offline replay
        run: ALPHALAKE_TEST_PYTHON=python go test ./internal/ingest -run 'TestCountryRiskRealArchiveReplay|TestBetaYieldRealArchiveReplay' -count=1
      - name: Test valuation backend
        working-directory: valuation/backend
        run: python -m pytest -q
      - name: Verify merged valuation adapters
        run: |
          python internal/ingest/testdata/anker-agent-adapter-2026/verify.py
          python internal/ingest/testdata/moutai-agent-adapter-2026/verify.py
